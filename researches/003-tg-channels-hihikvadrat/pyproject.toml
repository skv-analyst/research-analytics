[project]
name = "hihikvadrat"
version = "0.1.0"
description = "Collector for #о_себе intro messages from a Telegram analysts chat"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "pandas>=3.0.3",
    "telethon>=1.36",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hihikvadrat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
